<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#00C8FF"/>
      <stop offset="100%" style="stop-color:#8A2BE2"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C8FF">
        <animate attributeName="stop-color" values="#00C8FF;#8A2BE2;#00C8FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#00C8FF;#8A2BE2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Animated Particles -->
  <circle cx="100" cy="50" r="2" fill="#00C8FF" opacity="0.6">
    <animate attributeName="cy" values="50;250;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="200" r="1.5" fill="#8A2BE2" opacity="0.5">
    <animate attributeName="cy" values="200;30;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="100" r="2.5" fill="#FFFFFF" opacity="0.3">
    <animate attributeName="cy" values="100;270;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="250" r="1" fill="#00C8FF" opacity="0.7">
    <animate attributeName="cy" values="250;20;250" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="2" fill="#8A2BE2" opacity="0.4">
    <animate attributeName="cy" values="60;240;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="180" r="1.8" fill="#FFFFFF" opacity="0.25">
    <animate attributeName="cy" values="180;40;180" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="120" r="2.2" fill="#00C8FF" opacity="0.5">
    <animate attributeName="cy" values="120;260;120" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="220" r="1.3" fill="#8A2BE2" opacity="0.6">
    <animate attributeName="cy" values="220;50;220" dur="8.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="8.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="1" fill="#FFFFFF" opacity="0.4">
    <animate attributeName="cy" values="150;20;150" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="80" r="1.6" fill="#00C8FF" opacity="0.35">
    <animate attributeName="cy" values="80;260;80" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="30" r="1.2" fill="#8A2BE2" opacity="0.45">
    <animate attributeName="cy" values="30;280;30" dur="9.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="270" r="1.8" fill="#FFFFFF" opacity="0.2">
    <animate attributeName="cy" values="270;10;270" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Horizontal Line -->
  <line x1="200" y1="200" x2="1000" y2="200" stroke="url(#textGlow)" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Main Title -->
  <text x="600" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#textGlow)" text-anchor="middle" filter="url(#glow)">
    Vansh Sharma
  </text>

  <!-- Subtitle -->
  <text x="600" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" opacity="0.85" filter="url(#softGlow)">
    AI &amp; Reinforcement Learning Researcher  |  Full-Stack Architect
  </text>

  <!-- Animated underline beneath subtitle -->
  <rect x="300" y="185" width="0" height="2" rx="1" fill="url(#textGlow)" opacity="0.7">
    <animate attributeName="width" values="0;600;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;300;600" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom Tagline -->
  <text x="600" y="240" font-family="'Fira Code', monospace" font-size="14" fill="#00C8FF" text-anchor="middle" opacity="0.7">
    Building intelligent systems at the edge of computation 🚀
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom Wave -->
  <path d="M0 280 Q150 260 300 280 T600 280 T900 280 T1200 280 L1200 300 L0 300 Z" fill="#0D1117" opacity="0.5">
    <animate attributeName="d" values="M0 280 Q150 260 300 280 T600 280 T900 280 T1200 280 L1200 300 L0 300 Z;M0 280 Q150 295 300 280 T600 280 T900 280 T1200 280 L1200 300 L0 300 Z;M0 280 Q150 260 300 280 T600 280 T900 280 T1200 280 L1200 300 L0 300 Z" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
